<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!-- Remove o valor na 1ª posição do vetor/array -->

    <script>
      let dados = [10, 20, 30, 40, 50];
      let posicao = 1;

      console.log("Original:", dados);

      c = 1;
      for (let i = posicao; i < dados.length - 1; i++) {
        dados[i] = dados[i + 1];
        console.log("Vetor após a " + c + "ª passagem = ", dados);
        c++;
      }

      let removido = dados.pop();

      console.log("Após remoção: (pop)", dados);
      console.log("Removido o numero na : " + posicao + "ª posição");
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
