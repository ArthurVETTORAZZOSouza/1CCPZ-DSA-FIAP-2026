<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!-- Procura um valor especifico dentro do vetor/array -->

    <script>
      let dados = [0, 10, 20, 30, 40, 50];
      let procurado = 50;
      let posicao = -1;

      for (let i = 0; i < dados.length; i++) {
        if (dados[i] === procurado) {
          posicao = i;
          break;
        }
      }
      if (posicao == -1) console.log("Valor não Encontrado no vetor  ");
      else console.log("Valor  encontrado no vetor na posição = " + posicao);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
