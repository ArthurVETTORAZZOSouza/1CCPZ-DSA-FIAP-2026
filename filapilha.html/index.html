<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VETORES DSA</title>

    <script type="text/javascript">
      let dados = [];
      dados.push("A");
      dados.push("B");
      dados.push("C");

      for (i = 0; i < dados.length; i++) {
        alert("Elemento" + (i + 1) + ": " + dados[i]);
      }
      let removido = dados.pop();
      alert("Removido " + removido);

      for (i = 0; i < dados.length; i++) {
        alert("Elemento" + (i + 1) + ": " + dados[i]);
      }
      /*
            para i de 1 ate 3 faça
                escreva("elemento x")
            fimpara    

            .pop   = pilha
            .shift = fila

            */
    </script>

    <style>
      body {
        background-color: black;
      }
      h1,
      h2 {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>VETORES DSA em Java Script</h1>
    <h2>VAI CORINTHIANS!!!!</h2>
  </body>
</html>
