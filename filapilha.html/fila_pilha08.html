<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!-- Adiciona um valor numa posiçao especifica do vetor/array -->

    <script>
      let dados = [10, 20, 30, 40];
      let valor = 25;
      let posicao = 2;

      dados.push(0); // abre uma posição no final
      console.log(dados);
      for (let i = dados.length - 1; i > posicao; i--) {
        dados[i] = dados[i - 1];
        console.log(
          "Vetor depois da  " + (dados.length - i) + "ª passagem = ",
          dados,
        ); //mostra o valor de i a cada passagem
      }

      dados[posicao] = valor;
      console.log(dados);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
