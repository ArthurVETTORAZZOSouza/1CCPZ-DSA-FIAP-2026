<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!-- Procura e mostra quantas vezes aparece um valor especifico do vetor/array -->

    <script>
      let dados = [2, 5, 2, 7, 9];
      let alvo = 2;
      let contador = 0;

      for (let i = 0; i < dados.length; i++) {
        if (dados[i] == alvo) {
          contador++;
        }
      }
      if (contador == 0) console.log("Valor alvo não encontrado no vetor");
      else if (contador > 1) console.log("Encontrado", contador, "vezes");
      else console.log("Encontrado", contador, "vez");
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
