<!doctype html>
<html lang="en">
  <head>
    <title>FILA e PILHA</title>

    <!-- Verifica se os valores estão ordenados (crescente) do vetor/array -->

    <script>
      let v = [10, 20, 30, 40, 50];
      let ordenado = true;

      for (let i = 0; i < v.length - 1; i++) {
        if (v[i] > v[i + 1]) {
          ordenado = false;
          break;
        }
      }
      console.log("Ordenado?", ordenado);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
