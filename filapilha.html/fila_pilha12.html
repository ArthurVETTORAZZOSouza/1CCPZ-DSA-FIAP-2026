<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <script>
      let historico = [];
      function visitar(pagina) {
        historico.push(pagina);
      }
      function voltar() {
        if (historico.length > 1) {
          historico.pop();
          return historico[historico.length - 1];
        }
        return "Não há página anterior";
      }
      visitar("google.com");
      visitar("youtube.com");
      visitar("github.com");
      console.log(voltar());
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
