<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <script>
      let palavra = "asac e casa, Arthur e ruhtrA";
      let pilha = [];
      let invertida = "";
      for (let i = 0; i < palavra.length; i++) {
        pilha.push(palavra[i]);
      }
      while (pilha.length > 0) {
        invertida = invertida + pilha.pop();
      }
      console.log(invertida);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
