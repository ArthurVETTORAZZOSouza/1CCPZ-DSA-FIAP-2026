<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!-- Verifica qual é o maior valor do vetor/array -->

    <script>
      let dados = [8, 15, 3, 27, 2];
      let maior = dados[0];

      for (let i = 1; i < dados.length; i++) {
        if (dados[i] > maior) {
          maior = dados[i];
        }
      }
      console.log("Maior valor = " + maior);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
