<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FILA e PILHA</title>

    <!--remove o ultimo valor do vetor/array -->

    <script>
      let lista = [10, 20, 30, 40];
      let removido = lista.pop();
      console.log("Removido =", removido); //LIFO - PILHA , se fosse .shift seria FIFO - FILA
      console.log(lista);
    </script>

    <style>
      body {
        background-color: black;
      }
    </style>
  </head>
  <body></body>
</html>
