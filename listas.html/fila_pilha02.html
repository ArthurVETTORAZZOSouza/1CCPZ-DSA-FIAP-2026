    <title>FILA e PILHA</title>

    <!-- Soma os valores do vetor/array -->
    <script>
      let dados = [10, 20, 30, 40, 50];
      let soma = 0;

      for (let i = 0; i < dados.length; i++) {
        soma = soma + dados[i];
      }
      console.log("Soma = " + soma);
    </script>

      body {
        background-color: black;
      }
    </style>
